<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JamAtlanta | Under Construction</title>
    <style>
        /* Bringing in Oswald for headers and Montserrat for clean body text */
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Montserrat:wght@400;700&display=swap');

        body {
            /* Creates a subtle "stage light" spotlight effect behind him */
            background: radial-gradient(circle at 50% 40%, #2c2c2c 0%, #050505 80%);
            background-color: #050505;
            color: #f4f4f4;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .stage-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            height: 75vh; /* Gives him more room to breathe */
            display: flex;
            justify-content: center;
            align-items: flex-end;
            margin-top: 2vh;
        }

        /* The Text Behind JB */
        .background-text {
            position: absolute;
            top: 8%;
            width: 100%;
            text-align: center;
            font-size: clamp(3.5rem, 10vw, 9.5rem); 
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            line-height: 0.85; /* Squishes the text closer together */
            color: #dcb881; /* A slightly more muted, vintage gold */
            text-transform: uppercase;
            z-index: 1;
            text-shadow: 0px 15px 40px rgba(0, 0, 0, 0.9);
            letter-spacing: -2px;
        }

        /* The Transparent PNG */
        .jb-image {
            position: relative;
            z-index: 2;
            height: 95%; 
            object-fit: contain;
            /* THIS IS THE MAGIC: Fades his waist out into the background */
            -webkit-mask-image: linear-gradient(to bottom, black 75%, transparent 100%);
            mask-image: linear-gradient(to bottom, black 75%, transparent 100%);
            /* Heavy shadow to separate him from the text */
            filter: drop-shadow(0px 5px 25px rgba(0,0,0,0.9)); 
        }

        /* The bottom info section */
        .info-section {
            text-align: center;
            z-index: 3;
            margin-top: -30px; /* Pulls the text up into the faded area */
            padding: 0 20px 40px 20px;
        }

        .info-section h2 {
            font-family: 'Oswald', sans-serif;
            font-size: 2.8rem;
            margin: 0 0 10px 0;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .info-section p {
            font-size: 1.1rem;
            color: #b0b0b0;
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.6;
            font-weight: 400;
        }
        
        .accent {
            color: #dcb881;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="stage-container">
        <div class="background-text">
            SITTING AROUND,<br>WAITING FOR A WEBSITE
        </div>
        
        <img src="https://iili.io/Bt9zSaa.md.png" alt="John Bell playing guitar" class="jb-image">
    </div>

    <div class="info-section">
        <h2>JAMATLANTA.COM</h2>
        <p>We're currently in a <span class="accent">long spacey transition</span>. Check back soon for the ultimate Atlanta jam calendar.</p>
    </div>

</body>
</html>
